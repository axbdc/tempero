<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tempero — Receitas passo a passo</title>
    <meta name="description" content="Receitas simples, passo a passo, com medidas sem balança e temporizadores. Pequeno-almoço, lanche, almoço, jantar e petiscos." />
    <meta name="theme-color" content="#1F5C43" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:title" content="Tempero — Receitas passo a passo" />
    <meta property="og:description" content="Receitas simples com modo cozinhar guiado e temporizadores." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.png" />
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('tempero:tema'))
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
